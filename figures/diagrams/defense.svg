<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="300" fill="#ffffff"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#0f172a">Phòng thủ: chặn số ứng viên trước NMS</text>
  <text x="30" y="64" font-size="14" fill="#475569">Giữ lại 300 ứng viên điểm cao nhất trước NMS — cắt ~47% thời gian, gần như không mất độ chính xác</text>

  <!-- no defense -->
  <text x="40" y="112" font-size="14" font-weight="700" fill="#b91c1c">Không phòng thủ</text>
  <rect x="40" y="124" width="150" height="56" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="115" y="148" font-size="13" fill="#b91c1c" text-anchor="middle">~3000 ứng viên</text>
  <text x="115" y="167" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">bị tấn công</text>
  <g stroke="#94a3b8" stroke-width="2" fill="#94a3b8"><line x1="200" y1="152" x2="236" y2="152"/><polygon points="236,146 246,152 236,158"/></g>
  <rect x="258" y="124" width="110" height="56" rx="9" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="313" y="156" font-size="13" fill="#1e293b" text-anchor="middle">NMS + mask</text>
  <g stroke="#94a3b8" stroke-width="2" fill="#94a3b8"><line x1="378" y1="152" x2="414" y2="152"/><polygon points="414,146 424,152 414,158"/></g>
  <rect x="436" y="124" width="150" height="56" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="511" y="156" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="middle">chậm (K→300)</text>

  <!-- with defense -->
  <text x="40" y="226" font-size="14" font-weight="700" fill="#15803d">Chặn còn 300 trước NMS</text>
  <rect x="40" y="238" width="150" height="48" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="115" y="267" font-size="13" fill="#b91c1c" text-anchor="middle">~3000 ứng viên</text>
  <g stroke="#16a34a" stroke-width="2" fill="#16a34a"><line x1="200" y1="262" x2="236" y2="262"/><polygon points="236,256 246,262 236,268"/></g>
  <rect x="258" y="238" width="110" height="48" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="313" y="260" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle">cắt còn 300</text>
  <text x="313" y="277" font-size="11" fill="#15803d" text-anchor="middle">(top-k)</text>
  <g stroke="#16a34a" stroke-width="2" fill="#16a34a"><line x1="378" y1="262" x2="414" y2="262"/><polygon points="414,256 424,262 414,268"/></g>
  <rect x="436" y="238" width="150" height="48" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="511" y="267" font-size="15" font-weight="700" fill="#15803d" text-anchor="middle">nhanh −47%</text>

  <!-- side note -->
  <rect x="640" y="124" width="310" height="162" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="660" y="150" font-size="14" font-weight="700" fill="#334155">Chi phí độ chính xác (COCO val)</text>
  <text x="660" y="178" font-size="13" fill="#475569">Chặn trước NMS còn 300:</text>
  <text x="660" y="198" font-size="13" font-weight="700" fill="#15803d">seg mAP chỉ giảm ~0,22 điểm %</text>
  <text x="660" y="226" font-size="13" fill="#475569">Giảm độ phân giải ảnh:</text>
  <text x="660" y="246" font-size="13" font-weight="700" fill="#b91c1c">mất ~8–10 điểm % (đắt)</text>
  <text x="660" y="272" font-size="11.5" fill="#94a3b8">Giới hạn trước NMS là phòng thủ rẻ nhất.</text>
</svg>
