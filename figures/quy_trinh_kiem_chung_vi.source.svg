<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Quy trình tối ưu và kiểm chứng độc lập</title>
<desc id="desc">Hai nhánh: tối ưu dùng EOT và điểm trước NMS; kiểm chứng dùng miếng dán cố định, đo hậu xử lý và chất lượng. Camera vật lý là phần chưa xác nhận.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#355269"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#172b3b;font-size:21px;text-anchor:middle}.heading{font-weight:bold;font-size:25px;text-anchor:start}.small{font-size:18px}.box{fill:#fff;stroke:#53718a;stroke-width:2;rx:12}.edge{fill:none;stroke:#355269;stroke-width:2.5;marker-end:url(#arrow)}</style>
<rect width="1200" height="690" fill="white"/>
<rect x="16" y="18" width="1168" height="282" rx="16" fill="#edf5fa"/>
<text class="heading" x="40" y="55">A. TỐI ƯU TRÊN ẢNH BUS — 400 TRUY VẤN / SEED</text>
<rect class="box" x="40" y="90" width="210" height="102"/><text x="145" y="123">Ảnh RGB 320 × 320</text><text class="small" x="145" y="152">Chọn vị trí cố định</text><text class="small" x="145" y="177">Laplacian hoặc tâm</text>
<rect class="box" x="300" y="90" width="230" height="102"/><text x="415" y="123">Quần thể GA</text><text class="small" x="415" y="152">20 miếng dán 64 × 64</text><text class="small" x="415" y="177">Chèn số → một mẫu EOT</text>
<rect class="box" x="580" y="90" width="230" height="102"/><text x="695" y="123">YOLOv8n trên CPU</text><text class="small" x="695" y="152">Điểm tin cậy trước NMS</text><text class="small" x="695" y="177">Không lấy gradient</text>
<rect class="box" x="860" y="90" width="300" height="102"/><text x="1010" y="123">Tính fitness, cập nhật tốt nhất</text><text class="small" x="1010" y="152">Ngưỡng 0,01; trọng số 1,5</text><text class="small" x="1010" y="177">Lưu miếng dán đã chọn</text>
<path class="edge" d="M250 141 H300"/><path class="edge" d="M530 141 H580"/><path class="edge" d="M810 141 H860"/>
<path class="edge" d="M1010 192 V245 H415 V192"/>
<text class="small" x="710" y="234">Chọn 5 cá thể ưu tú → lai ghép → đột biến → thế hệ kế tiếp</text>
<text class="small" x="600" y="279">Điểm cao hơn là tốt hơn; fitness EOT không phải độ trễ NMS hay bằng chứng DoS.</text>
<rect x="16" y="316" width="1168" height="256" rx="16" fill="#eff7f2"/>
<text class="heading" x="40" y="354">B. ĐÁNH GIÁ KHÔNG EOT — MIẾNG DÁN VÀ TRỌNG SỐ CỐ ĐỊNH</text>
<rect class="box" x="40" y="388" width="210" height="110"/><text x="145" y="420">Ảnh sạch / chèn số</text><text class="small" x="145" y="450">bus, zidane, COCO128</text><text class="small" x="145" y="480">Các họa tiết đối chứng</text>
<rect class="box" x="300" y="388" width="230" height="110"/><text x="415" y="420">Suy luận YOLOv8n</text><text class="small" x="415" y="450">2.100 vị trí dự đoán</text><text class="small" x="415" y="480">Đo thời gian suy luận</text>
<rect class="box" x="580" y="388" width="230" height="110"/><text x="695" y="420">Lọc theo ngưỡng</text><text class="small" x="695" y="450">Đếm ứng viên sau ngưỡng</text><text class="small" x="695" y="480">Có / không top-100</text>
<rect class="box" x="860" y="388" width="300" height="110"/><text x="1010" y="420">NMS → phát hiện cuối</text><text class="small" x="1010" y="450">Độ trễ, số hộp; CPU / RSS*</text><text class="small" x="1010" y="480">Độ chính xác với nhãn COCO128</text>
<path class="edge" d="M250 443 H300"/><path class="edge" d="M530 443 H580"/><path class="edge" d="M810 443 H860"/>
<text class="small" x="600" y="541">* CPU/RSS và tổng thời gian vòng xử lý được đo trong phép thử hai ảnh; COCO128 đo công đoạn riêng.</text>
<rect x="40" y="596" width="1120" height="65" rx="12" fill="#fff8eb" stroke="#b68836" stroke-width="2" stroke-dasharray="8 5"/>
<text x="600" y="624">Mở rộng vật lý: miếng dán đã in → camera → giải mã → ảnh RGB → nhánh B</text>
<text class="small" x="600" y="650">Chưa có phép kiểm chứng vật lý đủ siêu dữ liệu; không nằm trong số liệu thực nghiệm mới.</text>
</svg>
